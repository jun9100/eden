services:
  eden-syncd:
    build: .
    image: eden-syncd:local
    environment:
      EDEN_SYNCD_TOKEN: ${EDEN_SYNCD_TOKEN:?set EDEN_SYNCD_TOKEN in .env}
      # Optional. Enables the protected LAN dashboard at /admin/.
      EDEN_SYNCD_ADMIN_TOKEN: ${EDEN_SYNCD_ADMIN_TOKEN:-}
      # Optional. Set both to expose OpenSave's separate WebDAV collection at /opensave/.
      EDEN_SYNCD_OPENSAVE_USERNAME: ${EDEN_SYNCD_OPENSAVE_USERNAME:-}
      EDEN_SYNCD_OPENSAVE_PASSWORD: ${EDEN_SYNCD_OPENSAVE_PASSWORD:-}
      EDEN_SYNCD_KEEP_SNAPSHOTS: ${EDEN_SYNCD_KEEP_SNAPSHOTS:-0}
      EDEN_SYNCD_KEEP_DAYS: ${EDEN_SYNCD_KEEP_DAYS:-0}
      TZ: ${TZ:-UTC}
    ports:
      - "${EDEN_SYNCD_BIND_ADDRESS:-127.0.0.1}:${EDEN_SYNCD_PORT:-8787}:8787"
    volumes:
      - ${EDEN_SYNCD_DATA_DIR:-./data}:/var/lib/eden-syncd
    restart: unless-stopped
