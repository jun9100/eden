#
# Synology Container Manager deployment. Copy this file as compose.yaml and create
# a .env file beside it containing EDEN_SYNCD_TOKEN and EDEN_SYNCD_ADMIN_TOKEN.

services:
  eden-syncd:
    image: jun9100/eden-syncd:v2026.10.21-metadata
    container_name: eden-syncd
    user: "1026:100"
    env_file:
      - .env
    ports:
      - "8788:8787"
    volumes:
      - /volume1/docker/eden-syncd/data:/var/lib/eden-syncd
    restart: unless-stopped
