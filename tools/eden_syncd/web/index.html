  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0 5 5L13 18a2.1 2.1 0 0 1-3-3l6.5-6.5Zm0 0L17 4l3 3-2.5 2.5M4 20l4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.3L4 9m0-5v5h5M4 13a8 8 0 0 0 14.3 4.3L20 15m0 5v-5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

<div id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-mark"><svg><use href="#i-logo"/></svg></div>
    <h1>Eden 存档同步</h1>
    <p>输入管理员令牌（EDEN_SYNCD_ADMIN_TOKEN）以管理存档、设备与存储。</p>
    <label class="field">
      <span>管理员令牌</span>
      <input id="login-token" name="password" type="password" autocomplete="current-password" required autofocus>
    </label>
    <p class="form-error" id="login-error" role="alert"></p>
    <button class="btn primary block" type="submit">登录</button>
    <small class="login-foot">会话保存 7 天 · 仅限家庭局域网使用</small>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="sidebar">
    <a class="brand" href="#/">
      <span class="brand-mark"><svg><use href="#i-logo"/></svg></span>
      <span><strong>Eden Sync</strong><small id="brand-version"></small></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/" data-route="overview"><svg><use href="#i-home"/></svg><span>概览</span></a>
      <a href="#/saves" data-route="saves"><svg><use href="#i-saves"/></svg><span>存档</span><em id="nav-saves"></em></a>
      <a href="#/devices" data-route="devices"><svg><use href="#i-devices"/></svg><span>设备</span><em id="nav-devices"></em></a>
      <a href="#/activity" data-route="activity"><svg><use href="#i-activity"/></svg><span>活动</span></a>
      <a href="#/maintenance" data-route="maintenance"><svg><use href="#i-tools"/></svg><span>维护</span></a>
    </nav>
    <div class="sidebar-foot">
      <button class="icon-btn" type="button" data-action="theme" title="切换主题"><svg><use href="#i-moon"/></svg></button>
      <button class="icon-btn" type="button" data-action="refresh" title="刷新"><svg><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" type="button" data-action="logout" title="退出登录"><svg><use href="#i-logout"/></svg></button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="modal-root" id="modal-root" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
