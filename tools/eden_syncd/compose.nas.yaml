services:
  eden-syncd:
    image: ${EDEN_SYNCD_IMAGE:-jun9100/eden-syncd:latest}
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      EDEN_SYNCD_TOKEN: ${EDEN_SYNCD_TOKEN:?set EDEN_SYNCD_TOKEN in .env}
      EDEN_SYNCD_ADMIN_TOKEN: ${EDEN_SYNCD_ADMIN_TOKEN:-}
    ports:
      - "${EDEN_SYNCD_BIND_ADDRESS:-192.168.12.14}:${EDEN_SYNCD_PORT:-8788}:8787"
    volumes:
      - ${EDEN_SYNCD_DATA_DIR:-/var/lib/eden-syncd}:/var/lib/eden-syncd
    restart: unless-stopped
