name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GIT_TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleMainlineRelease

      - name: Prepare Android package
        run: |
          cp src/android/app/build/outputs/apk/mainline/release/app-mainline-release.apk \
            eden-android-arm64-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eden-android-arm64-release
          path: eden-android-arm64-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: eden-android-arm64-release.apk
